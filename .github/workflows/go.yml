name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: reah-ci-stateless
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
      with:
        go-version: '1.24.2'

    - name: Ensure native build tools are available
      shell: bash
      run: |
        set -euo pipefail
        if command -v make >/dev/null 2>&1 && command -v gcc >/dev/null 2>&1; then
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential
        sudo rm -rf /var/lib/apt/lists/*

    - name: Get
      run: go get -v

    - name: lint
      uses: golangci/golangci-lint-action@v3.4.0
      with:
        args: ./...
        version: v1.55.2

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
